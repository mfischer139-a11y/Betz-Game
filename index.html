<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betz – Lucys Tierabenteuer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="game" id="game">

    <div class="sun"></div>
    <div class="cloud one">☁️</div>
    <div class="cloud two">☁️</div>

    <div class="forest-back">
      <span>🌲</span>
      <span>🌳</span>
      <span>🌲</span>
      <span>🌳</span>
      <span>🌲</span>
      <span>🌳</span>
    </div>

    <div class="path"></div>

    <div class="bushes">
      <span>🌿🌸</span>
      <span>🌼🌿</span>
    </div>

    <div class="hud">
      <div class="title">✨ BETZ</div>
      <div class="quest" id="quest">Aufgabe: Finde Lina 🦄</div>
    </div>

    <div id="lucy" class="character">👧🏼</div>

    <div id="lina" class="character">
      <span class="rider">👧🏼</span>
      🦄
    </div>

    <div class="speech" id="speech">
      Hallo Lucy! Laufe zu Lina. 🦄
    </div>

    <button class="action-button" id="actionButton" onclick="toggleRide()">
      Aufsteigen 🦄
    </button>

    <div class="controls">
      <button class="control up" onpointerdown="move('up')">⬆️</button>
      <button class="control left" onpointerdown="move('left')">⬅️</button>
      <button class="control right" onpointerdown="move('right')">➡️</button>
      <button class="control down" onpointerdown="move('down')">⬇️</button>
    </div>

    <div class="hint">
      Bewege Lucy mit den Pfeilen
    </div>

  </div>

  <script src="game.js"></script>
</body>
</html>
