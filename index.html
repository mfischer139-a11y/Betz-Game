<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betz – Lucys Tierabenteuer</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: #8fd7ff;
      touch-action: none;
    }

    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(
          to bottom,
          #80d3ff 0%,
          #c8efff 42%,
          #74c85e 42%,
          #4e9d48 100%
        );
    }

    .sun {
      position: absolute;
      top: 45px;
      right: 40px;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: #ffe66d;
      box-shadow: 0 0 35px #fff4ad;
    }

    .cloud {
      position: absolute;
      font-size: 70px;
      opacity: 0.85;
    }

    .cloud.one {
      top: 90px;
      left: 8%;
    }

    .cloud.two {
      top: 160px;
      right: 12%;
      font-size: 52px;
    }

    .forest-back {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22%;
      display: flex;
      justify-content: space-around;
      font-size: 70px;
      opacity: 0.92;
    }

    .path {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 58%;
      height: 58%;
      background: #d8b57a;
      clip-path: polygon(44% 0%, 56% 0%, 100% 100%, 0% 100%);
    }

    .bushes {
      position: absolute;
      bottom: 13%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 58px;
    }

    .hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .title {
      background: rgba(255,255,255,0.88);
      border-radius: 22px;
      padding: 10px 16px;
      font-weight: bold;
      color: #5e3c94;
      box-shadow: 0 5px 15px rgba(0,0,0,0.18);
    }

    .quest {
      background: rgba(255,255,255,0.88);
      border-radius: 22px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      color: #2e6630;
      box-shadow: 0 5px 15px rgba(0,0,0,0.18);
    }

    .character {
      position: absolute;
      font-size: 100px;
      z-index: 8;
      user-select: none;
      transform-origin: center bottom;
      transition: transform 0.15s ease;
    }

    #lucy {
      left: 12%;
      bottom: 16%;
    }

    #lina {
      right: 13%;
      bottom: 17%;
      font-size: 112px;
    }

    .riding #lucy {
      display: none;
    }

    .riding #lina {
      font-size: 126px;
    }

    .rider {
      display: none;
      position: absolute;
      left: 18px;
      top: -58px;
      font-size: 64px;
    }

    .riding #lina .rider {
      display: block;
    }

    .speech {
      position: absolute;
      left: 50%;
      bottom: 31%;
      transform: translateX(-50%);
      width: min(520px, 90%);
      padding: 18px 22px;
      background: white;
      border-radius: 26px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 8px 25px rgba(0,0,0,0.22);
      z-index: 15;
    }

    .speech.hidden {
      display: none;
    }

    .action-button {
      position: absolute;
      right: 22px;
      bottom: 110px;
      z-index: 30;
      border: none;
      border-radius: 30px;
      padding: 16px 22px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #ff5fbf, #8d5cff);
      box-shadow: 0 7px 0 #6337a5;
      display: none;
    }

    .action-button:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #6337a5;
    }

    .controls {
      position: absolute;
      left: 18px;
      bottom: 25px;
      width: 175px;
      height: 150px;
      z-index: 30;
    }

    .control {
      position: absolute;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.55);
      font-size: 28px;
      font-weight: bold;
      color: #5c3d91;
      backdrop-filter: blur(4px);
    }

    .up {
      left: 58px;
      top: 0;
    }

    .left {
      left: 0;
      top: 58px;
    }

    .right {
      right: 0;
      top: 58px;
    }

    .down {
      left: 58px;
      bottom: 0;
    }

    .hint {
      position: absolute;
      bottom: 18px;
      right: 18px;
      background: rgba(255,255,255,0.8);
      border-radius: 20px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: bold;
      color: #4c4c4c;
      z-index: 15;
    }

    @media (max-width: 500px) {
      .character {
        font-size: 86px;
      }

      #lina {
        font-size: 100px;
      }

      .speech {
        bottom: 36%;
        font-size: 18px;
      }

      .title {
        font-size: 14px;
      }

      .quest {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="game" id="game">

    <div class="sun"></div>
    <div class="cloud one">☁️</div>
    <div class="cloud two">☁️</div>

    <div class="forest-back">
      <span>🌲</span>
      <span>🌳</span>
      <span>🌲</span>
      <span>🌳</span>
      <span>🌲</span>
      <span>🌳</span>
    </div>

    <div class="path"></div>

    <div class="bushes">
      <span>🌿🌸</span>
      <span>🌼🌿</span>
    </div>

    <div class="hud">
      <div class="title">✨ BETZ</div>
      <div class="quest" id="quest">Aufgabe: Finde Lina 🦄</div>
    </div>

    <div id="lucy" class="character">👧🏼</div>

    <div id="lina" class="character">
      <span class="rider">👧🏼</span>
      🦄
    </div>

    <div class="speech" id="speech">
      Hallo Lucy! Laufe zu Lina. 🦄
    </div>

    <button class="action-button" id="actionButton" onclick="toggleRide()">
      Aufsteigen 🦄
    </button>

    <div class="controls">
      <button class="control up" onpointerdown="move('up')">⬆️</button>
      <button class="control left" onpointerdown="move('left')">⬅️</button>
      <button class="control right" onpointerdown="move('right')">➡️</button>
      <button class="control down" onpointerdown="move('down')">⬇️</button>
    </div>

    <div class="hint">
      Bewege Lucy mit den Pfeilen
    </div>

  </div>

  <script>
    const game = document.getElementById("game");
    const lucy = document.getElementById("lucy");
    const lina = document.getElementById("lina");
    const actionButton = document.getElementById("actionButton");
    const quest = document.getElementById("quest");
    const speech = document.getElementById("speech");

    let riding = false;

    let lucyX = window.innerWidth * 0.12;
    let lucyY = window.innerHeight * 0.16;

    let linaX = window.innerWidth * 0.72;
    let linaY = window.innerHeight * 0.17;

    function updatePositions() {
      if (!riding) {
        lucy.style.left = lucyX + "px";
        lucy.style.bottom = lucyY + "px";
      }

      lina.style.left = linaX + "px";
      lina.style.bottom = linaY + "px";
      lina.style.right = "auto";
    }

    function move(direction) {
      const step = riding ? 26 : 18;

      let targetX = riding ? linaX : lucyX;
      let targetY = riding ? linaY : lucyY;

      if (direction === "left") targetX -= step;
      if (direction === "right") targetX += step;
      if (direction === "up") targetY += step;
      if (direction === "down") targetY -= step;

      const maxX = window.innerWidth - 110;
      const maxY = window.innerHeight * 0.42;
      const minY = 40;

      targetX = Math.max(0, Math.min(maxX, targetX));
      targetY = Math.max(minY, Math.min(maxY, targetY));

      if (riding) {
        linaX = targetX;
        linaY = targetY;
      } else {
        lucyX = targetX;
        lucyY = targetY;
      }

      updatePositions();
      checkNearLina();
    }

    function checkNearLina() {
      if (riding) {
        actionButton.style.display = "block";
        return;
      }

      const dx = lucyX - linaX;
      const dy = lucyY - linaY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 145) {
        actionButton.style.display = "block";
        speech.classList.remove("hidden");
        speech.innerHTML = "Da ist Lina! 🦄<br>Du kannst jetzt aufsteigen.";
        quest.innerHTML = "Aufgabe geschafft: Lina gefunden ✨";
      } else {
        actionButton.style.display = "none";
      }
    }

    function toggleRide() {
      riding = !riding;
      game.classList.toggle("riding", riding);

      if (riding) {
        linaX = lucyX;
        linaY = lucyY;
        updatePositions();

        actionButton.innerHTML = "Absteigen 👧🏼";
        quest.innerHTML = "Neue Aufgabe: Reite durch den Wald 🌲";
        speech.innerHTML = "Juhu! Lucy reitet jetzt auf Lina! 🦄✨";
      } else {
        lucyX = linaX - 65;
        lucyY = linaY;
        updatePositions();

        actionButton.innerHTML = "Aufsteigen 🦄";
        speech.innerHTML = "Lucy ist abgestiegen.";
      }
    }

    updatePositions();
  </script>

</body>
</html>
