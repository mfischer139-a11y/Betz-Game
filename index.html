<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betz – Lucys Tierabenteuer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: #8ed6ff;
    }

    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;
      background:
        linear-gradient(
          to bottom,
          #79cfff 0%,
          #b9ebff 45%,
          #7bc95b 45%,
          #3d8d3d 100%
        );
    }

    /* Sonne */
    .sun {
      position: absolute;
      top: 45px;
      right: 45px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ffe45c;
      box-shadow: 0 0 35px #fff09a;
    }

    /* Wolken */
    .cloud {
      position: absolute;
      font-size: 75px;
      opacity: 0.9;
    }

    .cloud.one {
      top: 70px;
      left: 8%;
    }

    .cloud.two {
      top: 140px;
      right: 12%;
      font-size: 55px;
    }

    /* Wald */
    .forest {
      position: absolute;
      bottom: 20%;
      width: 100%;
      display: flex;
      justify-content: space-around;
      font-size: 85px;
      opacity: 0.95;
    }

    /* Weg */
    .path {
      position: absolute;
      bottom: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      height: 55%;
      background: #d8b47b;
      clip-path: polygon(42% 0%, 58% 0%, 100% 100%, 0% 100%);
    }

    /* Startmenü */
    .menu {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      z-index: 10;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(2px);
    }

    .logo {
      font-size: clamp(52px, 13vw, 105px);
      margin: 0;
      color: white;
      text-shadow:
        0 4px 0 #7849b8,
        0 8px 18px rgba(0,0,0,0.25);
    }

    .subtitle {
      margin: 8px 0 28px;
      font-size: clamp(20px, 5vw, 35px);
      color: white;
      font-weight: bold;
      text-shadow: 0 3px 6px rgba(0,0,0,0.35);
    }

    .characters {
      font-size: clamp(90px, 25vw, 170px);
      margin-bottom: 20px;
      filter: drop-shadow(0 8px 8px rgba(0,0,0,0.25));
    }

    .start-button {
      border: none;
      border-radius: 40px;
      padding: 20px 38px;
      font-size: clamp(23px, 6vw, 34px);
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #ff66c4, #8d5cff);
      box-shadow: 0 8px 0 #6337a5, 0 12px 25px rgba(0,0,0,0.25);
      cursor: pointer;
    }

    .start-button:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #6337a5;
    }

    /* Erste Spielszene */
    .story {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: flex-end;
      flex-direction: column;
      padding: 25px;
    }

    .story-character {
      font-size: 150px;
      margin-bottom: 5px;
    }

    .speech {
      width: min(650px, 95%);
      padding: 22px;
      margin-bottom: 35px;
      border-radius: 30px;
      background: white;
      font-size: clamp(21px, 5vw, 30px);
      font-weight: bold;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .continue-button {
      border: none;
      border-radius: 50%;
      width: 75px;
      height: 75px;
      margin-top: 18px;
      font-size: 38px;
      background: #ffdd55;
      cursor: pointer;
    }

    .sparkle {
      animation: sparkle 1.5s infinite alternate;
    }

    @keyframes sparkle {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.12);
      }
    }
  </style>
</head>

<body>

  <div class="game">

    <div class="sun"></div>

    <div class="cloud one">☁️</div>
    <div class="cloud two">☁️</div>

    <div class="forest">
      <span>🌲</span>
      <span>🌳</span>
      <span>🌲</span>
      <span>🌳</span>
      <span>🌲</span>
    </div>

    <div class="path"></div>

    <!-- STARTBILDSCHIRM -->
    <div class="menu" id="menu">

      <h1 class="logo">✨ BETZ ✨</h1>

      <div class="subtitle">
        Lucys magisches Tierabenteuer
      </div>

      <div class="characters sparkle">
        👧🏼 🦄
      </div>

      <button class="start-button" onclick="startGame()">
        ▶ Abenteuer starten
      </button>

    </div>

    <!-- ERSTE SZENE -->
    <div class="story" id="story">

      <div class="story-character">
        👧🏼 🦄
      </div>

      <div class="speech" id="speech">
        Hallo! Ich bin Lucy und das ist Lina. 🦄
        <br><br>
        Komm mit uns in den Wald!
        
        <br>

        <button class="continue-button" onclick="nextStory()">
          ➜
        </button>
      </div>

    </div>

  </div>

  <script>
    let storyStep = 0;

    function startGame() {
      document.getElementById("menu").style.display = "none";
      document.getElementById("story").style.display = "flex";
    }

    function nextStory() {

      const speech = document.getElementById("speech");

      storyStep++;

      if (storyStep === 1) {
        speech.innerHTML = `
          🐦 Oh! Hörst du das Zwitschern?
          <br><br>
          Ich glaube, die Vögel brauchen unsere Hilfe!
          <br>
          <button class="continue-button" onclick="nextStory()">➜</button>
        `;
      }

      else if (storyStep === 2) {
        speech.innerHTML = `
          🐦 🐤 🐦 🐤
          <br><br>
          Die Vögel sind völlig durcheinander!
          <br><br>
          Bald beginnt hier unser erstes Sortierspiel. ✨
          <br>
          <button class="continue-button" onclick="nextStory()">⭐</button>
        `;
      }

      else {
        speech.innerHTML = `
          🌈 Ende unserer ersten kleinen Demo!
          <br><br>
          Lucy und Lina warten auf ihr nächstes Abenteuer. 🦄
        `;
      }
    }
  </script>

</body>
</html>
